<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">International Youth Development logo</title>
  <desc id="logo-desc">A yellow, orange and purple circular emblem with International Youth Development around a dark center.</desc>
  <defs>
    <linearGradient id="ring" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#ffd34f"/>
      <stop offset="0.34" stop-color="#f9b659"/>
      <stop offset="0.68" stop-color="#e27c9a"/>
      <stop offset="1" stop-color="#a94ab6"/>
    </linearGradient>
    <radialGradient id="core" cx="43%" cy="28%" r="78%">
      <stop offset="0" stop-color="#35353d"/>
      <stop offset="0.5" stop-color="#202126"/>
      <stop offset="1" stop-color="#111217"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3c224c" flood-opacity=".18"/>
    </filter>
    <path id="title-arc" d="M 68,274 A 205,205 0 0 1 444,274"/>
  </defs>

  <circle cx="256" cy="256" r="246" fill="url(#ring)" filter="url(#soft-shadow)"/>

  <text fill="#060609" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="1.1">
    <textPath href="#title-arc" startOffset="50%" text-anchor="middle">International Youth Development</textPath>
  </text>

  <circle cx="256" cy="254" r="170" fill="url(#core)" stroke="#171820" stroke-width="4"/>

  <!-- Abstract person and ID mark -->
  <circle cx="267" cy="163" r="17" fill="#f5f5f6"/>
  <path d="M 173,153 C 196,174 217,185 240,190 C 217,198 192,190 169,173 C 151,160 139,151 126,145 C 143,167 159,181 180,193 C 196,202 208,214 213,231 L 222,267 L 222,351 L 194,359 L 185,267 C 182,235 172,211 155,195 C 144,185 134,172 126,157 Z" fill="#f5f5f6"/>
  <path d="M 226,196 C 250,204 274,202 296,187 C 282,207 258,222 232,225 Z" fill="#f5f5f6"/>
  <path d="M 152,190 C 164,219 167,252 168,290 L 168,363 L 143,356 L 143,247 C 143,224 146,205 152,190 Z" fill="#f5f5f6"/>

  <text x="253" y="354" fill="#f5f5f6" font-family="Arial, Helvetica, sans-serif" font-size="141" font-weight="900" letter-spacing="-12">D</text>
  <text x="256" y="397" fill="#f0f0f1" text-anchor="middle" font-family="Noto Sans Devanagari, Mangal, Arial, sans-serif" font-size="27" font-weight="500">अहं ब्रह्मास्मि</text>

  <!-- Three small emblem dots along the lower rim -->
  <circle cx="194" cy="459" r="16" fill="#f1f1f2" stroke="#1b1720" stroke-width="3"/>
  <circle cx="256" cy="468" r="16" fill="none" stroke="#4a245e" stroke-width="4"/>
  <circle cx="318" cy="459" r="16" fill="#ffdd35" stroke="#35202f" stroke-width="3"/>
</svg>
